<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Earnings Record Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #4f46e5;
      --primary-hover: #4338ca;
      --danger:        #dc2626;
      --bg:            #f1f5f9;
      --surface:       #ffffff;
      --border:        #e2e8f0;
      --border-focus:  #818cf8;
      --text:          #0f172a;
      --text-2:        #475569;
      --text-3:        #94a3b8;
      --radius:        10px;
      --shadow-md:     0 4px 20px rgba(0,0,0,.1);
    }
    [data-theme="dark"] {
      --primary:       #818cf8;
      --primary-hover: #6366f1;
      --danger:        #f87171;
      --bg:            #0f172a;
      --surface:       #1e293b;
      --border:        #334155;
      --border-focus:  #818cf8;
      --text:          #f1f5f9;
      --text-2:        #94a3b8;
      --text-3:        #4b5a6e;
      --shadow-md:     0 4px 20px rgba(0,0,0,.5);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      transition: background .2s, color .2s;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: white;
    }
    .brand-title { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
    .brand-sub   { font-size: 13px; color: var(--text-3); margin-top: 2px; }

    /* Card */
    .card {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-3);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
      transition: color .15s, background .15s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab:hover:not(.active) { color: var(--text-2); background: var(--bg); }

    /* Form panels */
    .panel { padding: 28px; display: none; }
    .panel.active { display: block; }

    .panel-title {
      font-size: 20px; font-weight: 700;
      margin-bottom: 4px;
    }
    .panel-sub {
      font-size: 13px; color: var(--text-3);
      margin-bottom: 24px;
    }

    /* Fields */
    .field { margin-bottom: 16px; }
    .field-label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: .4px;
    }
    .field-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-size: 15px; font-family: inherit;
      outline: none;
      color: var(--text);
      background: var(--bg);
      transition: border-color .15s, box-shadow .15s, background .2s;
    }
    .field-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(129,140,248,.18);
      background: var(--surface);
    }
    .field-hint {
      font-size: 11px; color: var(--text-3);
      margin-top: 5px;
    }

    /* Error */
    .error-msg {
      background: rgba(220,38,38,.1);
      border: 1px solid rgba(220,38,38,.3);
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Submit button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none; border-radius: var(--radius);
      background: var(--primary);
      color: white;
      font-size: 15px; font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, transform .1s, opacity .15s;
      margin-top: 4px;
    }
    .btn-submit:hover  { background: var(--primary-hover); }
    .btn-submit:active { transform: scale(.98); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

    /* Footer */
    .page-footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
    }

    /* Theme toggle */
    .theme-toggle-btn {
      position: fixed; top: 16px; right: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px; font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background .15s;
    }
    .theme-toggle-btn:hover { background: var(--bg); }

    @media (max-width: 480px) {
      .card { border-radius: 12px; }
      .panel { padding: 20px; }
      .brand { margin-bottom: 24px; }
    }
  </style>
</head>
<body>

  <button class="theme-toggle-btn" id="theme-toggle-btn">
    <span id="theme-icon">☀️</span>
    <span id="theme-label">Light</span>
  </button>

  <div class="page">
    <div class="brand">
      <div class="brand-icon">₹</div>
      <div>
        <div class="brand-title">Earnings Record Book</div>
        <div class="brand-sub">Challenge earnings tracker</div>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Sign In</button>
        <button class="tab" data-tab="register">Register</button>
      </div>

      <!-- Login -->
      <div class="panel active" id="panel-login">
        <div class="panel-title">Welcome back</div>
        <div class="panel-sub">Sign in to your account</div>
        <div class="error-msg" id="login-error"></div>
        <div class="field">
          <label class="field-label" for="login-username">Username</label>
          <input id="login-username" type="text" class="field-input" placeholder="your username" autocomplete="username" />
        </div>
        <div class="field">
          <label class="field-label" for="login-password">Password</label>
          <input id="login-password" type="password" class="field-input" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn-submit" id="login-btn">Sign In</button>
      </div>

      <!-- Register -->
      <div class="panel" id="panel-register">
        <div class="panel-title">Create account</div>
        <div class="panel-sub">Start tracking your earnings</div>
        <div class="error-msg" id="register-error"></div>
        <div class="field">
          <label class="field-label" for="reg-username">Username</label>
          <input id="reg-username" type="text" class="field-input" placeholder="choose a username" autocomplete="username" />
          <div class="field-hint">At least 3 characters, lowercase</div>
        </div>
        <div class="field">
          <label class="field-label" for="reg-password">Password</label>
          <input id="reg-password" type="password" class="field-input" placeholder="at least 6 characters" autocomplete="new-password" />
        </div>
        <div class="field">
          <label class="field-label" for="reg-confirm">Confirm Password</label>
          <input id="reg-confirm" type="password" class="field-input" placeholder="repeat password" autocomplete="new-password" />
        </div>
        <button class="btn-submit" id="register-btn">Create Account</button>
      </div>
    </div>

    <div class="page-footer">Your data is private and tied to your account.</div>
  </div>

  <script>
    'use strict';

    /* ── Theme ── */
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    updateThemeBtn(saved);

    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeBtn(next);
    });

    function updateThemeBtn(theme) {
      document.getElementById('theme-icon').textContent  = theme === 'dark' ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = theme === 'dark' ? 'Light' : 'Dark';
    }

    /* ── Tab switching ── */
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        clearErrors();
      });
    });

    function clearErrors() {
      document.querySelectorAll('.error-msg').forEach(e => {
        e.classList.remove('show'); e.textContent = '';
      });
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }

    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : btn.dataset.label;
    }

    /* ── Check already logged in ── */
    fetch('/api/auth/me')
      .then(r => r.ok ? r.json() : null)
      .then(data => { if (data && data.user) window.location.replace('/'); })
      .catch(() => {});

    /* ── Login ── */
    const loginBtn = document.getElementById('login-btn');
    loginBtn.dataset.label = loginBtn.textContent;

    async function doLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      clearErrors();
      if (!username || !password) { showError('login-error', 'Please fill in all fields.'); return; }

      setLoading(loginBtn, true);
      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { showError('login-error', data.error || 'Login failed'); return; }
        window.location.replace('/');
      } catch (e) {
        showError('login-error', 'Network error. Please try again.');
      } finally {
        setLoading(loginBtn, false);
      }
    }

    loginBtn.addEventListener('click', doLogin);
    document.getElementById('login-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('login-username').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-password').focus();
    });

    /* ── Register ── */
    const registerBtn = document.getElementById('register-btn');
    registerBtn.dataset.label = registerBtn.textContent;

    async function doRegister() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm  = document.getElementById('reg-confirm').value;
      clearErrors();

      if (!username || !password || !confirm) { showError('register-error', 'Please fill in all fields.'); return; }
      if (password !== confirm) { showError('register-error', 'Passwords do not match.'); return; }

      setLoading(registerBtn, true);
      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { showError('register-error', data.error || 'Registration failed'); return; }
        window.location.replace('/');
      } catch (e) {
        showError('register-error', 'Network error. Please try again.');
      } finally {
        setLoading(registerBtn, false);
      }
    }

    registerBtn.addEventListener('click', doRegister);
    document.getElementById('reg-confirm').addEventListener('keydown', e => {
      if (e.key === 'Enter') doRegister();
    });
  </script>
</body>
</html>
