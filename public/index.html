<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earnings Record Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">₹</div>
        <div>
          <h1 class="brand-title">Earnings Record Book</h1>
          <p class="brand-sub">Challenge earnings tracker</p>
        </div>
      </div>

      <div class="header-controls">
        <div class="rate-card" title="Change the USD → INR conversion rate">
          <span class="rate-label">USD Rate</span>
          <div class="rate-row">
            <span class="rate-prefix">₹</span>
            <input id="usd-rate-input" type="number" step="0.01" min="0" class="rate-input" />
            <button id="save-rate-btn" class="btn-rate">Update</button>
          </div>
        </div>
        <button id="print-btn" class="btn btn-ghost print-btn" title="Print / Save as PDF">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print
        </button>
        <button id="theme-toggle-btn" class="btn btn-ghost theme-toggle" title="Toggle theme" aria-label="Toggle dark/light theme">
          <span class="theme-icon-dark">☀️</span>
          <span class="theme-icon-light" style="display:none">🌙</span>
          <span class="theme-label-dark">Light</span>
          <span class="theme-label-light" style="display:none">Dark</span>
        </button>
        <div class="user-info" id="user-info" style="display:none">
          <span class="user-name" id="username-display"></span>
          <button id="logout-btn" class="btn btn-ghost btn-sm">Sign out</button>
        </div>
        <button id="add-date-btn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Date
        </button>
      </div>
    </div>
  </header>

  <!-- ── Summary strip ───────────────────────────────────────────── -->
  <div class="summary-strip" id="summary-strip">
    <div class="summary-item">
      <span class="summary-label">Total Expected</span>
      <span class="summary-value" id="sum-expected">$0.00</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="summary-label">Total Actual</span>
      <span class="summary-value" id="sum-actual-usd">$0.00</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="summary-label">Total Actual (INR)</span>
      <span class="summary-value" id="sum-actual-inr">₹0.00</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="summary-label">Dates Completed</span>
      <span class="summary-value" id="sum-complete">0 / 0</span>
    </div>
  </div>

  <!-- ── Filter bar ──────────────────────────────────────────────── -->
  <div class="filter-bar" id="filter-bar">
    <div class="filter-inner">
      <span class="filter-label">Filter:</span>
      <div class="filter-chips" id="filter-chips">
        <button class="filter-chip active" data-mode="all">All Time</button>
        <button class="filter-chip" data-mode="month">Month</button>
        <button class="filter-chip" data-mode="range">Date Range</button>
      </div>
      <div class="filter-controls" id="filter-controls"></div>
      <span class="filter-result" id="filter-result"></span>
    </div>
  </div>

  <!-- ── Main content ────────────────────────────────────────────── -->
  <main class="app-main">
    <div id="records-container"></div>

    <!-- Grand total -->
    <div id="grand-total" class="grand-total hidden">
      <div class="grand-total-inner">
        <span class="grand-label">Grand Total</span>
        <div class="grand-values">
          <div class="grand-item">
            <span class="grand-item-label">Expected (USD)</span>
            <span class="grand-item-value" id="grand-expected">$0.00</span>
          </div>
          <div class="grand-item">
            <span class="grand-item-label">Actual (USD)</span>
            <span class="grand-item-value" id="grand-actual-usd">$0.00</span>
          </div>
          <div class="grand-item grand-item-inr">
            <span class="grand-item-label">Actual (INR)</span>
            <span class="grand-item-value" id="grand-actual-inr">₹0.00</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ── Add Date Modal ──────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Add New Date</h2>
        <button id="modal-close-btn" class="modal-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="date-picker">Select Date</label>
        <input type="date" id="date-picker" class="field-input" />
        <p id="modal-error" class="modal-error hidden"></p>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="modal-confirm-btn" class="btn btn-primary">Add Date</button>
      </div>
    </div>
  </div>

  <!-- ── Print Preview ──────────────────────────────────────────── -->
  <div id="print-preview" class="print-preview hidden">
    <div class="pp-toolbar">
      <div class="pp-toolbar-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span>Digital Passbook Preview</span>
      </div>
      <div class="pp-toolbar-right">
        <button id="pp-close-btn" class="btn btn-secondary btn-sm">✕ Close</button>
        <button id="pp-print-btn" class="btn btn-primary btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print / Save as PDF
        </button>
      </div>
    </div>
    <div class="pp-body">
      <div id="print-view"></div>
    </div>
  </div>

  <!-- ── Toast ───────────────────────────────────────────────────── -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
